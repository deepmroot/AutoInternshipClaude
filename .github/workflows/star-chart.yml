# Redraws the README's star chart (branch star-chart-images) every 5 minutes,
# or when started by hand from the Actions tab. It runs on a timer, not on
# each new star, because a star-triggered run is listed under the name of the
# person who starred, which turns the Actions tab into a log of who starred.
# GitHub pauses timed workflows in a public repo after 60 days without
# activity; the Actions tab then has a button to turn this one back on.
name: Star chart

on:
  schedule:
    # Every 5 minutes (GitHub's shortest), at :02, :07, :12 and so on. Off
    # the hour, since GitHub's timers are most delayed on the hour. Busy times
    # still delay or skip some runs.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

# The repo gives workflows read-only access by default; this job pushes the
# chart's branch.
permissions:
  contents: write

# Two runs (timed runs bunched up after a delay, or one started by hand)
# would otherwise push at once and one push would be refused. A queued run
# reads the whole star list, so it covers the runs before it.
concurrency:
  group: star-chart
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    # A failed timed run still counts as passed, so a GitHub hiccup doesn't
    # send a failure email every so often (the script retries once first).
    # A run started by hand still fails and emails: use one when the chart
    # looks stale, to see the error.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v7

      - name: Draw the chart
        run: python3 .github/scripts/star_chart.py
        env:
          # GitHub lists stargazers only to a signed-in caller.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The images live on a branch of their own, replaced each time by one
      # commit holding just them, so main's history gets no bot commits. The
      # README loads them from there. The chart is the same file for the same
      # stars, so this pushes only when the stars changed.
      - name: Publish the chart if it changed
        env:
          BRANCH: star-chart-images
        run: |
          light=$(git hash-object -w .github/star-chart/stars.svg)
          dark=$(git hash-object -w .github/star-chart/stars-dark.svg)
          # A tree with only the two images, built without touching main's files.
          tree=$(printf '100644 blob %s\tstars-dark.svg\n100644 blob %s\tstars.svg\n' \
            "$dark" "$light" | git mktree)
          if git fetch --depth=1 origin "$BRANCH" &&
             [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$tree" ]; then
            echo "Chart unchanged."
            exit 0
          fi
          commit=$(git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$tree" -m "star chart")
          git push --force origin "$commit:refs/heads/$BRANCH"
