# Redraws the README's star chart (branch star-chart-images). An outside cron
# service starts it every 5 minutes through GitHub's API (a workflow_dispatch
# with quiet set), because GitHub's own timer starts late and skips runs.
# GitHub's timer still runs it hourly, in case the service stops. It runs on a
# timer, not on each new star, because a star-triggered run is listed under
# the name of the person who starred, which turns the Actions tab into a log
# of who starred. GitHub pauses timed workflows in a public repo after 60 days
# without activity; the Actions tab then has a button to turn this one back on.
name: Star chart

on:
  schedule:
    # Hourly at :17, the backup. Off the hour, since GitHub's timers are most
    # delayed on the hour.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      quiet:
        description: "Don't email if it fails (the cron service sets this)"
        type: boolean
        default: false

# The repo gives workflows read-only access by default; this job pushes the
# chart's branch, and deletes its own old runs (the last step).
permissions:
  contents: write
  actions: write

# Two runs (the cron service's and the hourly one, or one started by hand)
# would otherwise push at once and one push would be refused. A queued run
# reads the whole star list, so it covers the runs before it.
concurrency:
  group: star-chart
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    # A failed timed or quiet run still counts as passed, so a GitHub hiccup
    # doesn't send a failure email every so often (the script retries once
    # first). A run started by hand without quiet still fails and emails: use
    # one when the chart looks stale, to see the error. format() because the
    # API may send quiet as the string "true" and the Actions tab as a boolean.
    continue-on-error: ${{ github.event_name == 'schedule' || format('{0}', inputs.quiet) == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Draw the chart
        run: python3 .github/scripts/star_chart.py
        env:
          # GitHub lists stargazers only to a signed-in caller.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The images live on a branch of their own, replaced each time by one
      # commit holding just them, so main's history gets no bot commits. The
      # README loads them from there. The chart is the same file for the same
      # stars, so this pushes only when the stars changed.
      - name: Publish the chart if it changed
        env:
          BRANCH: star-chart-images
        run: |
          light=$(git hash-object -w .github/star-chart/stars.svg)
          dark=$(git hash-object -w .github/star-chart/stars-dark.svg)
          # A tree with only the two images, built without touching main's files.
          tree=$(printf '100644 blob %s\tstars-dark.svg\n100644 blob %s\tstars.svg\n' \
            "$dark" "$light" | git mktree)
          if git fetch --depth=1 origin "$BRANCH" &&
             [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$tree" ]; then
            echo "Chart unchanged."
            exit 0
          fi
          commit=$(git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$tree" -m "star chart")
          git push --force origin "$commit:refs/heads/$BRANCH"

      # Runs every 5 minutes would add about 300 lines a day to the Actions
      # tab. This keeps the newest 20 finished runs of this workflow and deletes
      # the rest, except failed ones (left for you to read and delete). GitHub
      # lists runs newest first; this run isn't finished, so it's never listed.
      # A delete that fails (another run got there first) is skipped.
      - name: Delete old runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 20
        run: |
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/star-chart.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion != "failure") | .id' |
            tail -n "+$((KEEP + 1))" |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null ||
                echo "Couldn't delete run $id; skipped."
            done
